<div class="container-fluid">
  <div class="row mt-3">
    <div class="col-12 d-flex">
      <div class="col-10"></div>
      <div class="col-2 d-flex justify-content-end">
        <button class="btn  btn-save">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-floppy"
            viewBox="0 0 16 16">
            <path d="M11 2H9v3h2z" />
            <path
              d="M1.5 0h11.586a1.5 1.5 0 0 1 1.06.44l1.415 1.414A1.5 1.5 0 0 1 16 2.914V14.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14.5v-13A1.5 1.5 0 0 1 1.5 0M1 1.5v13a.5.5 0 0 0 .5.5H2v-4.5A1.5 1.5 0 0 1 3.5 9h9a1.5 1.5 0 0 1 1.5 1.5V15h.5a.5.5 0 0 0 .5-.5V2.914a.5.5 0 0 0-.146-.353l-1.415-1.415A.5.5 0 0 0 13.086 1H13v4.5A1.5 1.5 0 0 1 11.5 7h-7A1.5 1.5 0 0 1 3 5.5V1H1.5a.5.5 0 0 0-.5.5m3 4a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5V1H4zM3 15h10v-4.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5z" />
          </svg>
        </button>
      </div>
    </div>
    <div class="col-11 container-main">
      <ul ngbNav #nav="ngbNav" [(activeId)]="active" class="nav-tabs">
        <li [ngbNavItem]="1">
          <button class="nav-btn" ngbNavLink>اطلاعات سند</button>
          <ng-template ngbNavContent>
            <div class="card mt-3 mb-3">
              <div class="card-body">
                <div class="row">
                  <div class="col-4 d-flex mt-2">
                    <label class="labels-input">شماره سند </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-4 d-flex mt-2">
                    <label class="labels-input"> نام فروشگاه</label>
                    <select class="form-select selects w-75" aria-label="Default select example">
                      <option selected>Open this select menu</option>
                      <option value="1">One</option>
                      <option value="2">Two</option>
                      <option value="3">Three</option>
                    </select>
                  </div>
                  <div class="col-4 d-flex mt-2">
                    <label class="labels-input">تاریخ سند </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>

                  <div class="col-4 d-flex mt-2">
                    <label class="labels-input">شماره فاکتور </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>

                  <div class="col-4 d-flex mt-2">
                    <label class="labels-input"> نام شرکت</label>
                    <select class="form-select selects w-75" aria-label="Default select example">
                      <option selected>Open this select menu</option>
                      <option value="1">One</option>
                      <option value="2">Two</option>
                      <option value="3">Three</option>
                    </select>
                  </div>
                  <div class="col-4 d-flex mt-2">
                    <label class="labels-input">تاریخ فاکتور </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-4 d-flex mt-2">
                    <label class="labels-input">تخفیف کلی </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-4 d-flex mt-2">
                    <label class="labels-input"> درصد تخفیف </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-4 d-flex mt-2">
                    <label class="labels-input">مبلغ متفرقه </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-4 d-flex mt-2">
                    <label class="labels-input"> نوع سند </label>
                    <select class="form-select selects w-75" aria-label="Default select example">
                      <option selected>Open this select menu</option>
                      <option value="1">One</option>
                      <option value="2">Two</option>
                      <option value="3">Three</option>
                    </select>
                  </div>
                  <div class="col-4 d-flex mt-2">
                    <label class="labels-input">حمل بار </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-4"></div>
                  <div class="col-12">
                    <label class="labels-input"> توضیحات </label>
                    <textarea class="form-control inputs mt-3" rows="4"></textarea>
                  </div>
                </div>
              </div>
            </div>
          </ng-template>
        </li>
        <li [ngbNavItem]="2">
          <button class="nav-btn" ngbNavLink>جزئیات اقلام</button>
          <ng-template ngbNavContent>

          </ng-template>
        </li>
      </ul>
      <div [ngbNavOutlet]="nav" class="mt-2"></div>
    </div>
  </div>
</div>
