<div class="container-fluid mt-4">
  <div class="col-11" style="margin: 0 auto 0 auto;">
    <div>
      <button class="btn btn-add-patient" (click)="openModal(content)">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-plus"
          viewBox="0 0 16 16">
          <path
            d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
        </svg>
        <span>
          افزودن بیمار جدید
        </span>
      </button>
    </div>
    <div class="card mt-3">
      <div class="card-body">
        <div class="table-responsive" style="overflow-y: scroll;height: 700px;">
          <table class="table table-striped table-hover">
            <thead class="thead-table">
              <tr>
                <th class="th-table" scope="col">کد پذیرش</th>
                <th class="th-table" scope="col">نام </th>
                <th class="th-table" scope="col">نام خانوادگی </th>
                <th class="th-table" scope="col"> نام پدر</th>
                <th class="th-table" scope="col">تاریخ ثبت</th>
                <th class="th-table" scope="col"> کد ملی</th>
                <th class="th-table" scope="col"> بیمه</th>
                <th class="th-table" scope="col"> شماره همراه</th>
                <th class="th-table" scope="col"> عملیات</th>
              </tr>
            </thead>
            <tbody>
              <tr class="text-center tr-table" *ngFor="let item of patientList">
                <td>{{item.patientID}}</td>
                <td>{{item.firstName}}</td>
                <td>{{item.lastName}}</td>
                <td>{{item.fatherName}}</td>
                <td>{{item.createDateShamsi}}</td>
                <td>{{item.nationalCode}}</td>
                <td>{{item.insuranceName}}</td>
                <td>{{item.mobileNumber}}</td>
                <td>
                  <button class="btn" (click)="openEditForm(item)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                      class="bi bi-pencil" viewBox="0 0 16 16">
                      <path
                        d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325" />
                    </svg>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <ng-template #content let-modal>
    <div class="card">
      <div class="card-body">
        <div class="col-10 d-flex justify-content-center" ngbAutofocus>
          <label class="label-national-code">کد ملی بیمار</label>
          <input type="text" class="form-control mt-3 w-75 input-national-code" [(ngModel)]="nationalCode">
        </div>
        <div class=" row d-flex btns mt-4">
          <div class="col-6 d-flex justify-content-end">
            <button class="btn btn-success btn-bottom-modal" (click)="getPatientWithNationalCode()">تایید</button>
          </div>
          <div class="col-6 d-flex justify-content-start">
            <button class="btn btn-danger btn-bottom-modal "
              (click)="modal.dismiss('Cross click');clearNationalCode()">انصراف</button>
          </div>
        </div>
      </div>
    </div>
  </ng-template>

  <ng-template #estelamModal let-modal>
    <div class="card">
      <div class="card-header">
        <p class="title-name mt-1">استعلام بیمار </p>
      </div>
      <div class="card-body">
        <div class="col-9 d-flex justify-content-center">
          <label class="labels-input"> تاریخ تولد</label>
          <ng-persian-datepicker ngbAutofocus [dateInitValue]="false" (dateOnSelect)="onSelectDateBirth($event)"
            class="w-75">
            <input class="form-control mt-3  inputs" type="text" [formControl]="dateValueBirthDate"
              onkeydown="return false;" />
          </ng-persian-datepicker>
        </div>
        <div class=" row d-flex btns mt-4">
          <div class="col-6 d-flex justify-content-end">
            <button class="btn btn-success btn-bottom-modal" (click)="submitEstelam()">تایید</button>
          </div>
          <div class="col-6 d-flex justify-content-start">
            <button class="btn btn-danger btn-bottom-modal "
              (click)="modal.dismiss('Cross click');clearDate()">انصراف</button>
          </div>
        </div>
      </div>
    </div>
  </ng-template>

  <ng-template #patient let-modal>
    <form [formGroup]="form">
      <div class="card">
        <div class="card-header">
          <p class="title-name mt-1">مشخصات بیمار </p>
        </div>
        <div class="card-body" ngbAutofocus>
          <div class="row">
            <div class="col-4 d-flex mt-2">
              <label class="labels-input">نام </label>
              <input type="text" class="form-control mt-3 w-75 inputs" formControlName="firstName">
            </div>
            <div class="col-4 d-flex mt-2">
              <label class="labels-input">نام خانوادگی </label>
              <input type="text" class="form-control mt-3 w-75 inputs" formControlName="lastName">
            </div>
            <div class="col-4 d-flex mt-2">
              <label class="labels-input"> کد ملی </label>
              <input type="text" class="form-control mt-3 w-75 inputs" formControlName="nationalCode">
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-4 d-flex mt-2">
              <label class="labels-input"> تاریخ تولد</label>
              <ng-persian-datepicker [dateInitValue]="false" (dateOnSelect)="onSelectBirthDate($event)" class="w-75">
                <input class="form-control mt-3  inputs" type="text" formControlName="birthDate"
                  onkeydown="return false;" />
              </ng-persian-datepicker>
            </div>
            <div class="col-4 d-flex mt-2">
              <label class="labels-input"> نام پدر</label>
              <input type="text" class="form-control mt-3 w-75 inputs" formControlName="fatherName">
            </div>
            <div class="col-4 d-flex mt-2">
              <label class="labels-input">تلفن همراه</label>
              <input type="text" class="form-control mt-3 w-75 inputs" formControlName="mobileNumber">
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-4 d-flex mt-2">
              <label class="labels-input">جنسیت</label>
              <select class="form-select selects w-75" (change)="onChangeGender($event)">
                <option class="disabledOption" [value]="null" [disabled]="true"> انتخاب کنید ... </option>
                <option *ngFor="let item of genderList" [value]="item.id" [selected]="item.id == genderIdSelected">
                  {{item.name}}
                </option>
              </select>
            </div>
            <div class="col-4 d-flex mt-2">
              <label class="labels-input"> شماره بیمه</label>
              <input type="text" class="form-control mt-3 w-75 inputs" formControlName="insuranceID">
            </div>
            <div class="col-4 d-flex mt-2">
              <label class="labels-input"> تاریخ پذیرش</label>
              <ng-persian-datepicker [dateInitValue]="false" (dateOnSelect)="onSelectReceptionDate($event)"
                class="w-75">
                <input class="form-control mt-3  inputs" type="text" formControlName="createDate"
                  onkeydown="return false;" />
              </ng-persian-datepicker>
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-4 d-flex mt-2">
              <label class="labels-input"> ایمیل</label>
              <input type="text" class="form-control mt-3 w-75 inputs" formControlName="email">
            </div>
            <div class="col-4 d-flex mt-2">
              <label class="labels-input">استان</label>
              <select class="form-select selects w-75" (change)="onChangeProvince($event)">
                <option class="disabledOption" [value]="null" [disabled]="true"> انتخاب کنید ... </option>
                <option *ngFor="let item of provinceList" [value]="item.code"
                  [selected]="item.code == provinceCodeSelected">
                  {{item.value}}
                </option>
              </select>
            </div>
            <div class="col-4 d-flex mt-2">
              <label class="labels-input">شهرستان</label>
              <select class="form-select selects w-75" (change)="onChangeCounty($event)">
                <option class="disabledOption" [value]="null" [disabled]="true"> انتخاب کنید ... </option>
                <option *ngFor="let item of countyList" [value]="item.code"
                  [selected]="item.code == countyCodeSelected">
                  {{item.value}}
                </option>
              </select>
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-12 d-flex mt-2">
              <label class="labels-input">آدرس</label>
              <input type="text" class="form-control mt-3 inputs" formControlName="address">
            </div>
            <div class="col-12 d-flex mt-2">
              <label class="labels-input"> توضیحات</label>
              <input type="text" class="form-control mt-3 inputs" formControlName="description">
            </div>
          </div>
          <div class=" row d-flex btns mt-4">
            <div class="col-6"></div>
            <div class="col-6 d-flex justify-content-end">
              <div class="col-4 d-flex justify-content-end">
                <button class="btn btn-success btn-bottom-modal" (click)="createNewPatient()">ثبت اطلاعات</button>
              </div>
              <div class="col-1"></div>
              <div class="col-4 d-flex justify-content-start">
                <button class="btn btn-danger btn-bottom-modal " (click)="modal.dismiss('Cross click')">انصراف</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </ng-template>

  <ng-template #editPatient let-modal>
    <form [formGroup]="formEdit">
      <div class="card">
        <div class="card-header">
          <p class="title-name mt-1">مشخصات بیمار </p>
        </div>
        <div class="card-body" ngbAutofocus>
          <div class="row">
            <div class="col-4 d-flex mt-2">
              <label class="labels-input">نام </label>
              <input type="text" class="form-control mt-3 w-75 inputs" formControlName="firstName">
            </div>
            <div class="col-4 d-flex mt-2">
              <label class="labels-input">نام خانوادگی </label>
              <input type="text" class="form-control mt-3 w-75 inputs" formControlName="lastName">
            </div>
            <div class="col-4 d-flex mt-2">
              <label class="labels-input"> کد ملی </label>
              <input type="text" class="form-control mt-3 w-75 inputs" formControlName="nationalCode">
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-4 d-flex mt-2">
              <label class="labels-input"> تاریخ تولد</label>
              <ng-persian-datepicker [dateInitValue]="false" (dateOnSelect)="onSelectBirthDate($event)" class="w-75">
                <input class="form-control mt-3  inputs" type="text" formControlName="birthDate"
                  onkeydown="return false;" />
              </ng-persian-datepicker>
            </div>
            <div class="col-4 d-flex mt-2">
              <label class="labels-input"> نام پدر</label>
              <input type="text" class="form-control mt-3 w-75 inputs" formControlName="fatherName">
            </div>
            <div class="col-4 d-flex mt-2">
              <label class="labels-input">تلفن همراه</label>
              <input type="text" class="form-control mt-3 w-75 inputs" formControlName="mobileNumber">
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-4 d-flex mt-2">
              <label class="labels-input">جنسیت</label>
              <select class="form-select selects w-75" (change)="onChangeGender($event)">
                <option class="disabledOption" [value]="null" [disabled]="true"> انتخاب کنید ... </option>
                <option *ngFor="let item of genderList" [value]="item.id" [selected]="item.id == selectedRow.genderIx">
                  {{item.name}}
                </option>
              </select>
            </div>
            <div class=" col-4 d-flex mt-2">
                  <label class="labels-input"> شماره بیمه</label>
                  <input type="text" class="form-control mt-3 w-75 inputs" formControlName="insuranceID">
            </div>
            <div class="col-4 d-flex mt-2">
              <label class="labels-input"> تاریخ پذیرش</label>
              <ng-persian-datepicker [dateInitValue]="false" (dateOnSelect)="onSelectReceptionDate($event)"
                class="w-75">
                <input class="form-control mt-3  inputs" type="text" formControlName="createDate"
                  onkeydown="return false;" />
              </ng-persian-datepicker>
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-4 d-flex mt-2">
              <label class="labels-input"> ایمیل</label>
              <input type="text" class="form-control mt-3 w-75 inputs" formControlName="email">
            </div>
            <div class="col-4 d-flex mt-2">
              <label class="labels-input">استان</label>
              <select class="form-select selects w-75" (change)="onChangeProvince($event)">
                <option class="disabledOption" [value]="null" [disabled]="true"> انتخاب کنید ... </option>
                <option *ngFor="let item of provinceList" [value]="item.code"
                  [selected]="item.code == selectedRow.provinceIx">
                  {{item.value}}
                </option>
              </select>
            </div>
            <div class="col-4 d-flex mt-2">
              <label class="labels-input">شهرستان</label>
              <select class="form-select selects w-75" (change)="onChangeCounty($event)">
                <option class="disabledOption" [value]="null" [disabled]="true"> انتخاب کنید ... </option>
                <option *ngFor="let item of countyList" [value]="item.code"
                  [selected]="item.code == selectedRow.cityIx">
                  {{item.value}} 
                </option>
              </select>
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-12 d-flex mt-2">
              <label class="labels-input">آدرس</label>
              <input type="text" class="form-control mt-3 inputs" formControlName="address">
            </div>
            <div class="col-12 d-flex mt-2">
              <label class="labels-input"> توضیحات</label>
              <input type="text" class="form-control mt-3 inputs" formControlName="description">
            </div>
          </div>
          <div class=" row d-flex btns mt-4">
            <div class="col-6"></div>
            <div class="col-6 d-flex justify-content-end">
              <div class="col-4 d-flex justify-content-end">
                <button class="btn btn-success btn-bottom-modal" (click)="saveEditPatient()">ثبت اطلاعات</button>
              </div>
              <div class="col-1"></div>
              <div class="col-4 d-flex justify-content-start">
                <button class="btn btn-danger btn-bottom-modal " (click)="modal.dismiss('Cross click')">انصراف</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </ng-template>

</div>
