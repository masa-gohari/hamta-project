<div class="container-fluid">
  <div class="row mt-3">
    <div class="col-12 d-flex">
      <div class="col-10"></div>
      <div class="col-2 d-flex justify-content-end">
        <button class="btn btn-save">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-floppy"
            viewBox="0 0 16 16">
            <path d="M11 2H9v3h2z" />
            <path
              d="M1.5 0h11.586a1.5 1.5 0 0 1 1.06.44l1.415 1.414A1.5 1.5 0 0 1 16 2.914V14.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14.5v-13A1.5 1.5 0 0 1 1.5 0M1 1.5v13a.5.5 0 0 0 .5.5H2v-4.5A1.5 1.5 0 0 1 3.5 9h9a1.5 1.5 0 0 1 1.5 1.5V15h.5a.5.5 0 0 0 .5-.5V2.914a.5.5 0 0 0-.146-.353l-1.415-1.415A.5.5 0 0 0 13.086 1H13v4.5A1.5 1.5 0 0 1 11.5 7h-7A1.5 1.5 0 0 1 3 5.5V1H1.5a.5.5 0 0 0-.5.5m3 4a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5V1H4zM3 15h10v-4.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5z" />
          </svg>
        </button>
      </div>
    </div>
    <div class="col-11 container-main">
      <ul ngbNav #nav="ngbNav" [(activeId)]="active" class="nav-tabs">
        <li [ngbNavItem]="1">
          <button class="nav-btn" ngbNavLink>اطلاعات دارو</button>
          <ng-template ngbNavContent>
            <div class="card mt-3 mb-5">
              <div class="card-body">
                <div class="row">
                  <div class="col-12 d-flex">
                    <input class="form-check-input" type="checkbox" value="" id="active">
                    <label class="form-check-label label-check-box" for="active">
                      فعال
                    </label>
                  </div>
                  <div class="col-6 d-flex mt-2">
                    <label class="labels-input">گروه دارویی</label>
                    <select class="form-select selects w-75" aria-label="Default select example">
                      <option selected>Open this select menu</option>
                      <option value="1">One</option>
                      <option value="2">Two</option>
                      <option value="3">Three</option>
                    </select>
                  </div>
                  <div class="col-6 d-flex mt-2">
                    <label class="labels-input">نام دارو </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-6 d-flex mt-2">
                    <label class="labels-input">نام انگلیسی دارو </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-6 d-flex mt-2">
                    <label class="labels-input">نام برند </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-6 d-flex mt-2">
                    <label class="labels-input">قیمت </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-6 d-flex mt-2">
                    <label class="labels-input">بارکد </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-6 d-flex mt-2">
                    <label class="labels-input">واحد </label>
                    <select class="form-select selects w-75" aria-label="Default select example">
                      <option selected>Open this select menu</option>
                      <option value="1">One</option>
                      <option value="2">Two</option>
                      <option value="3">Three</option>
                    </select>
                  </div>
                  <div class="col-6 d-flex mt-2">
                    <label class="labels-input">شکل دارو </label>
                    <select class="form-select selects w-75" aria-label="Default select example">
                      <option selected>Open this select menu</option>
                      <option value="1">One</option>
                      <option value="2">Two</option>
                      <option value="3">Three</option>
                    </select>
                  </div>
                  <div class="col-6 d-flex mt-2">
                    <label class="labels-input">کد ژنریک </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-6 d-flex mt-2">
                    <label class="labels-input"> IRC </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-6 d-flex mt-2">
                    <label class="labels-input"> ERX </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-6 d-flex mt-2">
                    <label class="labels-input"> واحد خرید </label>
                    <select class="form-select selects w-75" aria-label="Default select example">
                      <option selected>Open this select menu</option>
                      <option value="1">One</option>
                      <option value="2">Two</option>
                      <option value="3">Three</option>
                    </select>
                  </div>
                  <div class="col-6 d-flex mt-2">
                    <label class="labels-input"> واحد فروش </label>
                    <select class="form-select selects w-75" aria-label="Default select example">
                      <option selected>Open this select menu</option>
                      <option value="1">One</option>
                      <option value="2">Two</option>
                      <option value="3">Three</option>
                    </select>
                  </div>
                  <div class="col-6"></div>

                </div>
              </div>
            </div>
          </ng-template>
        </li>
        <li [ngbNavItem]="2">
          <button class="nav-btn" ngbNavLink>اطلاعات بیمه ای</button>
          <ng-template ngbNavContent>
            <div class="card mt-3 mb-5">
              <div class="card-body">
                <div class="row">
                  <div class="col-12 d-flex">
                    <input class="form-check-input" type="checkbox" value="" id="accept-bimeh">
                    <label class="form-check-label label-check-box" for="accept-bimeh">
                      خدمت مورد قبول بیمه می باشد
                    </label>
                  </div>
                  <div class="col-6 d-flex mt-2">
                    <label class="labels-input">مورد قبول بیمه </label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-6 d-flex mt-2">
                  </div>
                  <div class="col-12 d-flex mt-2">
                    <input class="form-check-input" type="checkbox" value="" id="accept-bimeh" (change)="checkedExceptionInsurance()">
                    <label class="form-check-label label-check-box" for="accept-bimeh">
                      دارو مورد نظر استثناء بیمه ای دارد؟
                    </label>
                  </div>
                  <div class="col-11 container-main">
                    <div class="card mt-5 mb-5" *ngIf="isExceptionInsurance">
                      <div class="card-body">
                        <div class="row">
                          <div class="col-11"></div>
                          <div class="col-1 d-flex justify-content-end">
                            <button class="btn mt-1 btn-plus">
                              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor"
                                class="bi bi-plus" viewBox="0 0 16 16">
                                <path
                                  d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                              </svg>
                            </button>
                          </div>
                        </div>
                        <div class="row">
                          <div class="col-6 d-flex mt-2">
                            <label class="labels-input">نام بیمه </label>
                            <select class="form-select selects w-75" aria-label="Default select example">
                              <option selected>Open this select menu</option>
                              <option value="1">One</option>
                              <option value="2">Two</option>
                              <option value="3">Three</option>
                            </select>
                          </div>
                          <div class="col-6 d-flex mt-2">
                            <label class="labels-input"> مبلغ مورد قبول بیمه</label>
                            <input type="text" class="form-control mt-3 w-75 inputs">
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </ng-template>
        </li>
      </ul>
      <div [ngbNavOutlet]="nav" class="mt-2"></div>
    </div>
  </div>
</div>
