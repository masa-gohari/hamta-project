<div class="container-fluid">
  <div class="row mt-3">
    <div class="col-12 d-flex">
      <div class="col-10"></div>
      <div class="col-2 d-flex justify-content-end">
        <button class="btn btn-cancel">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-x-lg" viewBox="0 0 16 16">
            <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
          </svg>
        </button>
        <button class="btn  btn-save">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-floppy"
            viewBox="0 0 16 16">
            <path d="M11 2H9v3h2z" />
            <path
              d="M1.5 0h11.586a1.5 1.5 0 0 1 1.06.44l1.415 1.414A1.5 1.5 0 0 1 16 2.914V14.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14.5v-13A1.5 1.5 0 0 1 1.5 0M1 1.5v13a.5.5 0 0 0 .5.5H2v-4.5A1.5 1.5 0 0 1 3.5 9h9a1.5 1.5 0 0 1 1.5 1.5V15h.5a.5.5 0 0 0 .5-.5V2.914a.5.5 0 0 0-.146-.353l-1.415-1.415A.5.5 0 0 0 13.086 1H13v4.5A1.5 1.5 0 0 1 11.5 7h-7A1.5 1.5 0 0 1 3 5.5V1H1.5a.5.5 0 0 0-.5.5m3 4a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5V1H4zM3 15h10v-4.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5z" />
          </svg>
        </button>
      </div>
    </div>
    <div class="col-11 container-main">
      <ul ngbNav #nav="ngbNav" [(activeId)]="active" class="nav-tabs">
        <li [ngbNavItem]="1">
          <button class="nav-btn" ngbNavLink>اطلاعات خدمت</button>
          <ng-template ngbNavContent>
            <div class="card mt-3">
              <div class="card-body">
                <p class="title-name">اطلاعات پایه</p>
                <div class="row">
                  <div class="col-4 d-flex mt-2">
                    <label class="labels-input">کد خدمت</label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                  <div class="col-4 d-flex mt-2">
                    <label class="labels-input">گروه خدمت</label>
                    <select class="form-select selects w-75" aria-label="Default select example">
                      <option selected>Open this select menu</option>
                      <option value="1">One</option>
                      <option value="2">Two</option>
                      <option value="3">Three</option>
                    </select>
                  </div>
                  <div class="col-4 d-flex mt-2">
                    <label class="labels-input">نام خدمت</label>
                    <input type="text" class="form-control mt-3 w-75 inputs">
                  </div>
                </div>
                <div class="row">
                  <div class="col-4 d-flex mt-2">
                    <label class="labels-input">نوع خدمت</label>
                    <select class="form-select selects w-75" aria-label="Default select example">
                      <option selected>Open this select menu</option>
                      <option value="1">One</option>
                      <option value="2">Two</option>
                      <option value="3">Three</option>
                    </select>
                  </div>
                  <div class="col-8"></div>
                </div>
                <div class="col-12 d-flex">
                  <label class="labels-input">نام کامل خدمت</label>
                  <input type="text" class="form-control mt-3 inputs">
                </div>
                <div class="col-12 d-flex">
                  <label class="labels-input"> توضیحات</label>
                  <input type="text" class="form-control mt-3 inputs">
                </div>
              </div>
            </div>
            <div class="card mt-3 mb-5">
              <div class="card-body">
                <div class="row">
                  <div class="col-4 mt-2">
                    <div class=" d-flex">
                      <label class="labels-input">تعرفه خدمت</label>
                      <input type="text" class="form-control mt-3 w-75 inputs">
                    </div>
                    <div class="d-flex">
                      <input class="form-check-input" type="checkbox" value="" id="bimeh">
                      <label class="form-check-label label-check-box" for="bimeh">
                        خدمت مورد قبول بیمه می باشد
                      </label>
                    </div>
                  </div>
                  <div class="col-8"></div>
                </div>
                <div class="row">
                  <div class="col-4 mt-2">
                    <div class=" d-flex">
                      <label class="labels-input"> مورد قبول بیمه</label>
                      <input type="text" class="form-control mt-3 w-75 inputs">
                    </div>

                  </div>
                </div>
                <div class="col-7"></div>
                <div class="col-12 d-flex">
                  <input class="form-check-input" type="checkbox" value="" id="bimeh">
                  <label class="form-check-label label-check-box" for="bimeh">
                    این خدمت در مرکز دیگری انجام می شود(خدمت ارجاعی)
                  </label>
                </div>
              </div>
            </div>
          </ng-template>
        </li>
        <li [ngbNavItem]="2">
          <button class="nav-btn" ngbNavLink>استثناء تخصص پزشک</button>
          <ng-template ngbNavContent>
            <div class="row">
              <div class="col-10"></div>
              <div class="col-2 d-flex justify-content-end">
                <button class="btn btn-save">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                    class="bi bi-floppy" viewBox="0 0 16 16">
                    <path d="M11 2H9v3h2z" />
                    <path
                      d="M1.5 0h11.586a1.5 1.5 0 0 1 1.06.44l1.415 1.414A1.5 1.5 0 0 1 16 2.914V14.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14.5v-13A1.5 1.5 0 0 1 1.5 0M1 1.5v13a.5.5 0 0 0 .5.5H2v-4.5A1.5 1.5 0 0 1 3.5 9h9a1.5 1.5 0 0 1 1.5 1.5V15h.5a.5.5 0 0 0 .5-.5V2.914a.5.5 0 0 0-.146-.353l-1.415-1.415A.5.5 0 0 0 13.086 1H13v4.5A1.5 1.5 0 0 1 11.5 7h-7A1.5 1.5 0 0 1 3 5.5V1H1.5a.5.5 0 0 0-.5.5m3 4a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5V1H4zM3 15h10v-4.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5z" />
                  </svg>
                </button>
                <button class="btn btn-add">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                    class="bi bi-plus-lg" viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                      d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2" />
                  </svg>
                </button>
              </div>
            </div>
            <div class="card mt-3 mb-5">
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-striped table-hover">
                    <thead class="thead-table">
                      <tr>
                        <th class="th-table" scope="col"> نوع بیمه</th>
                        <th class="th-table" scope="col">تخصص پزشک </th>
                        <th class="th-table" scope="col">درصد فرانشیز </th>
                        <th class="th-table" scope="col"> مورد قبول بیمه</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr class="text-center tr-table">
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </ng-template>
        </li>
        <li [ngbNavItem]="3">
          <button class="nav-btn" ngbNavLink>بیمه گران این خدمت</button>
          <ng-template ngbNavContent>
            <div class="card mt-3 mb-5">
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-striped table-hover">
                    <thead class="thead-table">
                      <tr>
                        <th class="th-table" scope="col"> نوع بیمه</th>
                        <th class="th-table" scope="col"> نام بیمه </th>
                        <th class="th-table" scope="col">مبلغ مورد قبول بیمه </th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr class="text-center tr-table">
                        <td></td>
                        <td></td>
                        <td></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </ng-template>
        </li>
      </ul>
      <div [ngbNavOutlet]="nav" class="mt-2"></div>
    </div>
  </div>
</div>
